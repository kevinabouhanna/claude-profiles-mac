name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Show the toolchain
        run: swiftc --version && xcrun --show-sdk-version
      - name: Build (universal, ad-hoc signed)
        run: ./build.sh
      - name: Check both architectures are in
        run: lipo -archs "build/Claude Profiles.app/Contents/MacOS/ClaudeProfiles"
      # claude-swap gives the app real refreshes to run; without it the test still
      # covers the menu bar, dropdown and Settings.
      - name: Install claude-swap
        run: pipx install claude-swap || echo "claude-swap didn't install; testing without it"
      # Fails on excess CPU, redraws, memory growth or a leftover child process.
      # See scripts/energy-test.sh for the limits.
      - name: Energy test
        run: ./scripts/energy-test.sh
